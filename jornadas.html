<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEÑA MAULAS - Jornadas</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- DB Config -->
    <script src="js/firebase-init.js"></script>
    <script src="js/db-service.js"></script>
</head>

<body class="page-body jornadas-page">
    <script src="js/auth.js"></script>
    <script src="js/scoring.js"></script>

    <div class="main-container">
        <!-- Header -->
        <header class="header-actions">
            <div>
                <a href="index.html" class="btn-back">← Volver al Inicio</a>
                <h1 class="page-title">Resultados Partidos <span id="current-datetime"
                        style="display:block; font-size:1rem; font-weight:400; color:#666; margin-top:0.2rem;"></span>
                </h1>
            </div>

            <div class="action-buttons">
                <button id="btn-import-matches" class="btn-action" style="background: #e65100; color: white;">
                    📋 Importar Partidos
                </button>
                <button id="btn-import-rss" class="btn-action" style="background: var(--primary-green); color: white;"
                    onclick="startRSSImport()">
                    📥 Importar Resultados RSS
                </button>
                <button id="btn-new-jornada" class="btn-action btn-add">
                    ➕ Nueva Jornada
                </button>
                <button id="btn-delete-all-jornadas" class="btn-action"
                    style="background:#d32f2f; color:white; margin-left:10px;">
                    🗑️ Borrar TODO
                </button>
            </div>
        </header>

        <!-- Dynamic Grid of Jornadas -->
        <div id="jornadas-grid" class="jornadas-grid">
            <!-- Populated by JS -->
            <p style="color:#666; grid-column: 1/-1; text-align:center; padding: 2rem;">Cargando jornadas...</p>
        </div>

    </div>

    <!-- Modal for Jornada Details/Editing -->
    <div id="jornada-modal" class="modal-overlay">
        <div class="modal">
            <form id="jornada-form">
                <div
                    style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom:1px solid #eee; padding-bottom:1rem;">
                    <h2 id="modal-title" style="margin:0; display:flex; align-items:center; gap:8px;">
                        <span>Jornada</span>
                        <input type="number" id="inp-jornada-num" min="1" max="999"
                            style="width:70px; font-size:1.2rem; font-weight:bold; border:1px solid transparent; background:transparent; color:inherit; padding:2px 5px; border-radius:4px;">
                        <span id="modal-mode-badge"
                            style="font-size:0.8rem; background:#eee; padding:2px 8px; border-radius:4px; vertical-align: middle;">Vista</span>
                    </h2>
                    <div style="display:flex; gap:10px;">
                        <button type="button" id="btn-edit-mode" class="btn-action"
                            style="background: #fff9c4; color:#f57f17;">✏️ Editar</button>
                        <button type="submit" id="btn-save-jornada" class="btn-action btn-add" style="display:none;">💾
                            Guardar</button>
                        <button type="button" id="btn-close-modal" class="btn-action"
                            style="background: #f5f5f5; color:#333;">Cerrar</button>
                    </div>
                </div>

                <input type="hidden" id="inp-jornada-id">

                <div class="form-group" style="display:flex; gap:1rem;">
                    <div style="flex:1">
                        <label for="inp-season">Temporada</label>
                        <input type="text" id="inp-season" value="2026-2027" readonly>
                    </div>
                    <div style="flex:1">
                        <label for="inp-date">Fecha</label>
                        <input type="text" id="inp-date" placeholder="Ej: 23-24 Agosto">
                    </div>

                    <div
                        style="flex:0.5; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                        <label for="inp-active" style="margin-bottom:5px;">Activa</label>
                        <input type="checkbox" id="inp-active" style="width:25px; height:25px; cursor:pointer;">
                    </div>
                </div>

                <div class="form-group">
                    <label>Partidos y Resultados (Quiniela)</label>
                    <div id="matches-container" class="matches-grid-container">
                        <!-- 15 Matches Rows generated by JS -->
                    </div>
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <label>Premios por Categoría (€)</label>
                    <div id="prizes-container" class="prizes-grid-container">
                        <!-- Prizes Rows generated by JS -->
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="btn-delete-jornada" class="delete-btn" style="margin-right:auto;">Eliminar
                        Jornada</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Text Import (Matches) -->
    <div id="modal-import-matches" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99999; justify-content:center; align-items:center;">
        <div class="modal import-modal-content" style="background:var(--card-bg, #fff); border-radius:12px; max-width:650px; width:95%; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 15px 35px rgba(0,0,0,0.35);">
            <!-- Modal Header -->
            <div style="display:flex; justify-content:space-between; align-items:center; padding:1.2rem 1.5rem; border-bottom:1px solid var(--input-border, #eee); background:var(--card-bg, #fff);">
                <h2 style="margin:0; font-size:1.3rem; display:flex; align-items:center; gap:8px; color:var(--text-main, #333);">
                    📋 <span>Importar Partidos desde Texto</span>
                </h2>
                <button type="button" id="btn-close-import-modal" class="btn-action" style="background:#f5f5f5; color:#555; border:none; padding:4px 10px; border-radius:6px; cursor:pointer; font-weight:bold;">✖</button>
            </div>

            <!-- Modal Body (Scrollable) -->
            <div style="padding:1.5rem; overflow-y:auto; flex:1;">
                <!-- Step 1: Text Input View -->
                <div id="import-input-step">
                    <p style="margin-top:0; color:var(--text-secondary, #666); font-size:0.9rem; line-height:1.4;">
                        Pega aquí el texto copiado de la web (Revista Quinielista u otra fuente) que contenga el número de jornada, fecha y lista de partidos:
                    </p>
                    <textarea id="import-matches-textarea" rows="11" placeholder="Ejemplo:&#10;Jornada: 8&#10; 20/09/2026&#10;1º  Osasuna  Rayo V.&#10;2º  Athletic Club  Alavés...&#10;...&#10;15º  At. Madrid&#10;R. Madrid" style="width:100%; box-sizing:border-box; padding:0.8rem; border-radius:8px; border:1.5px solid var(--input-border, #ccc); font-family:monospace; font-size:0.85rem; line-height:1.4; resize:vertical; background:var(--input-bg, #fafafa); color:var(--text-main, #333);"></textarea>
                    
                    <div id="import-error-msg" style="display:none; margin-top:1rem; padding:0.8rem 1rem; border-radius:8px; background:rgba(244, 67, 54, 0.1); border:1px solid rgba(244, 67, 54, 0.3); color:#d32f2f; font-size:0.85rem;"></div>

                    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1.2rem;">
                        <button type="button" id="btn-cancel-import" class="btn-action" style="background:#eee; color:#444;">Cancelar</button>
                        <button type="button" id="btn-analyze-import" class="btn-action" style="background:#e65100; color:white; font-weight:bold;">🔍 Analizar Texto</button>
                    </div>
                </div>

                <!-- Step 2: Summary / Preview View -->
                <div id="import-summary-step" style="display:none;">
                    <!-- Summary info card -->
                    <div id="import-summary-header" style="background:var(--pastel-bg, #f5f5f5); border:1px solid var(--input-border, #ddd); border-radius:8px; padding:1rem; margin-bottom:1.2rem;">
                        <!-- Injected by JS -->
                    </div>

                    <!-- Warnings card (if any) -->
                    <div id="import-warnings-card" style="display:none; margin-bottom:1.2rem; padding:0.8rem 1rem; border-radius:8px; background:rgba(255, 152, 0, 0.12); border:1px solid rgba(255, 152, 0, 0.35); color:#e65100; font-size:0.85rem;">
                        <!-- Injected by JS -->
                    </div>

                    <h4 style="margin:0 0 0.8rem 0; color:var(--text-main, #333); font-size:1rem;">⚽ Resumen de Partidos a Crear (15)</h4>
                    <div id="import-matches-list" style="max-height:280px; overflow-y:auto; border:1px solid var(--input-border, #eee); border-radius:8px; padding:0.5rem; background:var(--card-bg, #fff);">
                        <!-- Injected by JS -->
                    </div>

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.5rem; gap:10px; flex-wrap:wrap;">
                        <button type="button" id="btn-discard-import" class="btn-action" style="background:#ffebee; color:#d32f2f; border:1px solid rgba(244,67,54,0.3);">❌ Desechar</button>
                        <div style="display:flex; gap:10px;">
                            <button type="button" id="btn-back-to-text" class="btn-action" style="background:#eee; color:#444;">✏️ Volver a Editar</button>
                            <button type="button" id="btn-confirm-create-jornada" class="btn-action btn-add" style="background:#2e7d32; color:white; font-weight:bold;">✅ Confirmar y Crear Jornada</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="theme-controls">
        <button class="theme-toggle-btn" id="themeToggle" title="Cambiar Tema">🌙</button>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/rss-importer.js"></script>
    <!-- PDF Importer removed (See Web Scraper in rss-importer.js) -->
    <script src="js/telegram-service.js"></script>
    <script src="js/dice-service.js"></script>
    <script src="js/text-importer.js"></script>
    <script src="js/jornadas.js"></script>

    <!-- Theme handled by auth.js -->
</body>

</html>
