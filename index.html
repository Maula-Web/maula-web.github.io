<head>
    <meta charset="UTF-8">

    <!-- Favicon & Mobile App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Peña Maulas">
    <meta name="application-name" content="Peña Maulas">
    <meta name="theme-color" content="#1976d2">
    <!-- Performance Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700&family=Raleway:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- DB Config -->
    <script src="js/firebase-init.js"></script>
    <script src="js/db-service.js"></script>
    <style>
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
            padding: 0 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .stat-card {
            background: var(--dash-card-bg);
            /* Glassmorphism effect */
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--main-shadow);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .stat-card h3 {
            margin: 0 0 1rem 0;
            color: var(--dash-card-title);
            font-family: var(--dash-card-title-font);
            font-size: var(--dash-card-title-size);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .stat-value {
            color: var(--dash-card-value);
            font-family: var(--dash-card-value-font);
            font-size: var(--dash-card-value-size);
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        /* Neon Glows for values */
        .stat-card[style*="border-bottom: 4px solid var(--primary-blue)"] .stat-value {
            color: var(--primary-blue);
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }

        .stat-card[style*="border-bottom: 4px solid var(--primary-green)"] .stat-value {
            color: var(--primary-green);
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
        }

        .stat-card[style*="border-bottom: 4px solid var(--primary-red)"] .stat-value {
            color: var(--primary-red);
            text-shadow: 0 0 15px rgba(255, 61, 0, 0.6);
        }

        .stat-card[style*="border-bottom: 4px solid var(--primary-purple)"] .stat-value {
            color: var(--primary-purple);
            text-shadow: 0 0 15px rgba(245, 0, 255, 0.6);
        }

        .stat-card[style*="border-bottom: 4px solid var(--primary-orange)"] .stat-value {
            color: var(--primary-orange);
            text-shadow: 0 0 15px rgba(255, 145, 0, 0.6);
        }

        .stat-wide-card {
            grid-column: 1 / -1;
            background: var(--dash-wide-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--main-shadow);
            color: var(--dash-wide-text);
            font-family: var(--dash-wide-text-font);
            font-size: var(--dash-wide-text-size);
        }

        .stat-wide-card h3 {
            color: var(--dash-wide-text) !important;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body class="home-body">
    <script src="js/auth.js"></script>
    <script src="js/scoring.js"></script>

    <!-- Dynamic Header will be injected by auth.js -->

    <!-- Main Content Area -->
    <div
        style="width: 100%; max-width: 1400px; margin: 0 auto; padding: 1rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;">

        <!-- Stats Grid -->
        <div id="dashboard-stats" class="dashboard-stats" style="width: 100%;">
            <!-- Populated by JS -->
            <p style="text-align:center; width:100%; color:#888;">Cargando resumen...</p>
        </div>

    </div>

    <script src="js/utils.js"></script>
    <script src="js/telegram-service.js"></script>
    <script src="js/dice-service.js"></script>
    <script src="js/dashboard.js"></script>


    <script>
        // Theme Logic is now handled by auth.js + theme-editor.js
    </script>
</body>

</html>
