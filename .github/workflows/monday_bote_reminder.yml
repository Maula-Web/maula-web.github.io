name: Recordatorio Saldo Bote Lunes
run-name: 🪙 Recordatorio Saldo Bote Lunes 09:00

on:
  schedule:
    # Programado en minutos no congestionados (:15 y :45) con reintento automático
    # Madrid Verano (CEST, UTC+2): 07:15 UTC (09:15 Madrid) y 07:45 UTC (09:45 Madrid)
    - cron: '15 7 * * 1'
    - cron: '45 7 * * 1'
    # Madrid Invierno (CET, UTC+1): 08:15 UTC (09:15 Madrid) y 08:45 UTC (09:45 Madrid)
    - cron: '15 8 * * 1'
    - cron: '45 8 * * 1'
  workflow_dispatch:
    # Permite dispararlo manualmente en cualquier momento desde la pestaña "Actions" de GitHub

jobs:
  send-bote-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Recordatorio Push de Saldo de Bote
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/monday_bote_reminder_cron.js
