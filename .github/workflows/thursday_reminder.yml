name: Recordatorio Quiniela Jueves
run-name: ⏰ Recordatorio Quiniela Jueves 16:30

on:
  schedule:
    # Programado en minutos no congestionados (:15 y :35) con ventana de reintento.
    # Madrid Verano (CEST, UTC+2):
    # - 14:15 UTC = 16:15 Madrid
    # - 14:35 UTC = 16:35 Madrid (reintento automático si hay cola de espera en runners)
    - cron: '15 14 * * 4'
    - cron: '35 14 * * 4'
    # Madrid Invierno (CET, UTC+1):
    # - 15:15 UTC = 16:15 Madrid
    # - 15:35 UTC = 16:35 Madrid (reintento automático si hay cola de espera en runners)
    - cron: '15 15 * * 4'
    - cron: '35 15 * * 4'
  workflow_dispatch:
    # Permite ejecutarlo manualmente en cualquier momento desde la pestaña "Actions" de GitHub

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Recordatorio Push de Quiniela
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/thursday_reminder_cron.js
