name: Fix Reminder Flags Firestore
run-name: 🛠️ Fix Reminder Flags Firestore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fix-flags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Fix Firestore Flags
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/fix_firestore_reminder_flags.js
